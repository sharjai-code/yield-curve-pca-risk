[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yield-curve-pca-risk"
version = "0.1.0"
description = "Reproducible Treasury yield-curve PCA and bond portfolio risk research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<4", "matplotlib>=3.7,<4", "scipy>=1.10,<2"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5"]

[project.scripts]
yield-curve-risk = "yield_curve_pca.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]
